<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="176" viewBox="0 0 1040 176">
  <defs>
    <clipPath id="mine"><rect width="148" height="20" rx="10"/></clipPath>
    <clipPath id="acct"><rect width="264" height="20" rx="10"/></clipPath>
  </defs>
  <rect width="1040" height="176" rx="14" fill="#1f1f1e"/>
  <rect x="16" y="22" width="1008" height="56" rx="10" fill="#2a2a28" stroke="#3a3a37"/>
  <g transform="translate(32 36) scale(1.4)" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">
    <g clip-path="url(#mine)">
      <rect width="60" height="20" fill="#555"/><text x="32" y="14">session</text>
      <rect x="60" width="23" height="20" fill="#97ca00"/><text x="71.5" y="14">2</text>
      <rect x="83" width="65" height="20" fill="#6c757d"/><text x="113.5" y="14">14.79M</text>
    </g>
    <g transform="translate(156)">
      <g clip-path="url(#acct)">
        <rect width="63" height="20" fill="#555"/><text x="33.5" y="14">account</text>
        <rect x="63" width="76" height="20" fill="#fe7d37"/><text x="101" y="14">4 · 1d 18h</text>
        <rect x="139" width="61" height="20" fill="#6c757d"/><text x="169.5" y="14">184.2M</text>
        <rect x="200" width="64" height="20" fill="#44cc11"/><text x="230" y="14">w-34%</text>
      </g>
    </g>
    <text x="430" y="14" text-anchor="start" fill="#9a9893" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">weekly % rising fast, check other sessions</text>
  </g>
  <g stroke="#6b6a66" stroke-width="1.2">
    <line x1="132" y1="66" x2="132" y2="96"/>
    <line x1="191" y1="66" x2="191" y2="136"/>
    <line x1="392" y1="66" x2="392" y2="96"/>
    <line x1="488" y1="66" x2="488" y2="136"/>
    <line x1="572" y1="66" x2="572" y2="96"/>
    <line x1="820" y1="66" x2="820" y2="136"/>
  </g>
  <g fill="#6b6a66">
    <circle cx="132" cy="96" r="2.5"/><circle cx="191" cy="136" r="2.5"/>
    <circle cx="392" cy="96" r="2.5"/><circle cx="488" cy="136" r="2.5"/>
    <circle cx="572" cy="96" r="2.5"/><circle cx="820" cy="136" r="2.5"/>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d8d6d1" text-anchor="middle">
    <text x="132" y="116">session level, 1 to 5</text>
    <text x="191" y="156">tokens this session</text>
    <text x="392" y="116">account level and time left</text>
    <text x="488" y="156">tokens since the weekly reset</text>
    <text x="600" y="116">weekly limit used</text>
    <text x="820" y="156">the main cause, when there is one</text>
