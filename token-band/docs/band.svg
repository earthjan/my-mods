<svg xmlns="http://www.w3.org/2000/svg" width="960" height="176" viewBox="0 0 960 176">
  <defs>
    <clipPath id="mine"><rect width="160" height="20" rx="10"/></clipPath>
    <clipPath id="acct"><rect width="221" height="20" rx="10"/></clipPath>
  </defs>
  <rect width="960" height="176" rx="14" fill="#1f1f1e"/>
  <rect x="16" y="22" width="928" height="56" rx="10" fill="#2a2a28" stroke="#3a3a37"/>
  <g transform="translate(32 36) scale(1.4)" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">
    <g clip-path="url(#mine)">
      <rect width="80" height="20" fill="#555"/><text x="40" y="14">this session</text>
      <rect x="80" width="23" height="20" fill="#97ca00"/><text x="91.5" y="14">2</text>
      <rect x="103" width="57" height="20" fill="#6c757d"/><text x="131.5" y="14">14.79M</text>
      <rect x="103" width="1" height="20" fill="#fff" fill-opacity=".35"/>
    </g>
    <g transform="translate(168)">
      <g clip-path="url(#acct)">
        <rect width="89" height="20" fill="#555"/><text x="44.5" y="14">account-wide</text>
        <rect x="89" width="76" height="20" fill="#fe7d37"/><text x="127" y="14">4 (1d 18h)</text>
        <rect x="165" width="56" height="20" fill="#44cc11"/><text x="193" y="14">w-34%</text>
        <rect x="165" width="1" height="20" fill="#fff" fill-opacity=".35"/>
      </g>
    </g>
    <text x="399" y="14" text-anchor="start" fill="#9a9893" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">weekly % rising fast, check other sessions</text>
  </g>
  <g stroke="#6b6a66" stroke-width="1.2">
    <line x1="160" y1="66" x2="160" y2="96"/>
    <line x1="216" y1="66" x2="216" y2="136"/>
    <line x1="445" y1="66" x2="445" y2="96"/>
    <line x1="537" y1="66" x2="537" y2="136"/>
    <line x1="740" y1="66" x2="740" y2="96"/>
  </g>
  <g fill="#6b6a66">
    <circle cx="160" cy="96" r="2.5"/><circle cx="216" cy="136" r="2.5"/>
    <circle cx="445" cy="96" r="2.5"/><circle cx="537" cy="136" r="2.5"/>
    <circle cx="740" cy="96" r="2.5"/>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d8d6d1" text-anchor="middle">
    <text x="160" y="116">this session's level, 1 to 5</text>
    <text x="216" y="156">tokens this session</text>
    <text x="445" y="116">account level and time until the limit</text>
    <text x="537" y="156">weekly limit used</text>
    <text x="740" y="116">the main cause, when there is one</text>
  </g>
</svg>
