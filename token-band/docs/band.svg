<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="176" viewBox="0 0 1120 176">
  <defs>
    <clipPath id="mine"><rect width="168" height="20" rx="10"/></clipPath>
    <clipPath id="acct"><rect width="173" height="20" rx="10"/></clipPath>
    <clipPath id="week"><rect width="103" height="20" rx="10"/></clipPath>
  </defs>
  <rect width="1120" height="176" rx="14" fill="#1f1f1e"/>
  <rect x="16" y="22" width="1088" height="56" rx="10" fill="#2a2a28" stroke="#3a3a37"/>
  <g transform="translate(32 36) scale(1.4)" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11" text-anchor="middle" fill="#fff">
    <g clip-path="url(#mine)">
      <rect width="84" height="20" fill="#555"/><text x="44" y="14">this session</text>
      <rect x="84" width="23" height="20" fill="#97ca00"/><text x="95.5" y="14">2</text>
      <rect x="107" width="61" height="20" fill="#6c757d"/><text x="135.5" y="14">14.79M</text>
    </g>
    <g transform="translate(176)">
      <g clip-path="url(#acct)">
        <rect width="93" height="20" fill="#555"/><text x="48.5" y="14">account-wide</text>
        <rect x="93" width="80" height="20" fill="#fe7d37"/><text x="131" y="14">4 · 1d 18h</text>
      </g>
    </g>
    <g transform="translate(357)">
      <g clip-path="url(#week)">
        <rect width="57" height="20" fill="#555"/><text x="30.5" y="14">weekly</text>
        <rect x="57" width="46" height="20" fill="#44cc11"/><text x="78" y="14">34%</text>
      </g>
    </g>
    <text x="470" y="14" text-anchor="start" fill="#9a9893" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">weekly % rising fast, check other sessions</text>
  </g>
  <g stroke="#6b6a66" stroke-width="1.2">
    <line x1="166" y1="66" x2="166" y2="96"/>
    <line x1="222" y1="66" x2="222" y2="136"/>
    <line x1="462" y1="66" x2="462" y2="96"/>
    <line x1="641" y1="66" x2="641" y2="136"/>
    <line x1="870" y1="66" x2="870" y2="96"/>
  </g>
  <g fill="#6b6a66">
    <circle cx="166" cy="96" r="2.5"/><circle cx="222" cy="136" r="2.5"/>
    <circle cx="462" cy="96" r="2.5"/><circle cx="641" cy="136" r="2.5"/>
    <circle cx="870" cy="96" r="2.5"/>
  </g>
  <g font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#d8d6d1" text-anchor="middle">
    <text x="166" y="116">this session's level, 1 to 5</text>
    <text x="222" y="156">tokens this session</text>
    <text x="462" y="116">account level and time until the limit</text>
    <text x="641" y="156">weekly limit used</text>
    <text x="870" y="116">the main cause, when there is one</text>
  </g>
